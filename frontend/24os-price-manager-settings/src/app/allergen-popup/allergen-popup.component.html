<div class="overlay" *ngIf="screen_loader">
  <div class="center">
    <mat-progress-spinner diameter=50 mode="indeterminate" color="primary">
    </mat-progress-spinner>
  </div>
</div>

<h2 mat-dialog-title *ngIf="data.title == 'Create New Allergen'">{{'Create_New_Allergen' | translate }}</h2>
<h2 mat-dialog-title *ngIf="data.title == 'Edit Allergen'">{{'Edit_Allergen' | translate }}</h2>

<form [formGroup]="reactiveAllergenForm" (ngSubmit)="submitAllergenDialog(data.action, data.id)">
  <div mat-dialog-content>
    <mat-form-field appearance="outline" class="form_field_allergen">
      <mat-label>{{'Allergen' | translate }}</mat-label>
      <input matInput formControlName="allergen">
    </mat-form-field>
    <mat-form-field appearance="outline" class="form_field_allergen_desc">
      <mat-label>{{'Description' | translate }}</mat-label>
      <textarea matInput formControlName="allergen_desc"></textarea>
    </mat-form-field>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="true">{{'Cancel' | translate }}</button>
    <button type="submit" mat-flat-button color="primary" *ngIf="data.action==='create'; else edit" class="create_btn">
      <mat-progress-spinner class="mat-progress-spinner-white" *ngIf="loader" diameter="20" mode="indeterminate"></mat-progress-spinner>
      {{'Create' | translate }}
    </button>
    <ng-template #edit>
      <button type="submit" mat-flat-button color="primary">
        <mat-progress-spinner class="mat-progress-spinner-white" *ngIf="loader" diameter="20" mode="indeterminate"></mat-progress-spinner>
        {{'Save' | translate }}
      </button>
    </ng-template>
  </div>

</form>
