<div class="overlay" *ngIf="screen_loader">
  <div class="center">
    <mat-progress-spinner diameter=50 mode="indeterminate" color="primary">
    </mat-progress-spinner>
  </div>
</div>

<h2 mat-dialog-title *ngIf="data.title == 'Create New Menu'">{{'Create_New_Menu' | translate }}</h2>
<h2 mat-dialog-title *ngIf="data.title == 'Edit Menu'">{{'Edit_Menu' | translate }}</h2>
<form [formGroup]="reactiveMenuForm" (ngSubmit)="submitMenuDialog(data.action, data.id)">
  <div mat-dialog-content>
    <mat-form-field appearance="outline" class="form_field_menu_name">
      <mat-label>{{'Menu_Name' | translate }}</mat-label>
      <input matInput formControlName="menu">
    </mat-form-field>

    <mat-label class="label">{{'Menu_Type' | translate }}:</mat-label>
    <mat-form-field appearance="outline" class="form_field_price_manager_post_categories">
      <mat-select formControlName="priceManagerPostCategories" multiple [(ngModel)]="selection">
        <mat-option *ngFor="let priceManagerPostCategory of priceManagerPostCategoryList"
          [value]="priceManagerPostCategory">
          {{priceManagerPostCategory}}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="true">{{'Cancel' | translate }}</button>
    <button type="submit" mat-flat-button color="primary" *ngIf="data.action==='create'; else edit" class="create_btn">
      <mat-progress-spinner class="mat-progress-spinner-white" *ngIf="loader" diameter="20" mode="indeterminate"></mat-progress-spinner>
      {{'Create' | translate }}
    </button>
    <ng-template #edit>
      <button type="submit" mat-flat-button color="primary">
        <mat-progress-spinner class="mat-progress-spinner-white" *ngIf="loader" diameter="20" mode="indeterminate"></mat-progress-spinner>
        {{'Save' | translate }}
      </button>
    </ng-template>
  </div>

</form>
